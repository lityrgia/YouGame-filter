name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm run package:all
      - uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: |
            release/*.zip
            release/*.xpi
          if-no-files-found: error
